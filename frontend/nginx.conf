server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        # Solo redirigir si NO es una ruta de auth/api/dex y falta la cookie
        set $should_redirect "";
        if ($cookie_auth_token = "") {
            set $should_redirect "Y";
        }
        if ($request_uri ~ ^/(login|callback|logout|api|dex)) {
            set $should_redirect "";
        }
        
        if ($should_redirect = "Y") {
            return 302 /login;
        }

        try_files $uri $uri/ /index.html;
    }

    # Proxy Dex
    location /dex {
        proxy_pass http://dex:5556;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API and auth routes to gateway
    location ~ ^/(login|logout|callback|api)(/.*)?$ {
        proxy_pass http://gateway:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
