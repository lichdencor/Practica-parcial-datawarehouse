server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        # Redirect to /login if auth_token cookie is missing
        if ($cookie_auth_token = "") {
            return 302 $scheme://$http_host/login;
        }
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and auth routes to gateway
    location ~ ^/(login|logout|callback|api)(/.*)?$ {
        proxy_pass http://gateway:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
